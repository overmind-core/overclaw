[project]
authors = [{ name = "Overmind Ltd" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "psutil>=5.9.0",
    "requests>=2.31.0",
    "rich>=14.0.0",
    "typer>=0.25.0",
    "opentelemetry-api>=1.35.0",
    "opentelemetry-sdk>=1.35.0",
    "opentelemetry-exporter-otlp-proto-http>=1.35.0",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-instrumentation>=0.60b1",
    "opentelemetry-semantic-conventions>=0.60b1",
    "opentelemetry-semantic-conventions-ai>=0.4.13",
    # LLM instrumentations (upstream traceloop packages — patched at runtime by opentelemetry-overmind)
    "opentelemetry-instrumentation-anthropic>=0.53.0",
    "opentelemetry-instrumentation-google-generativeai>=0.53.0",
    "opentelemetry-instrumentation-agno>=0.53.0",
    "opentelemetry-instrumentation-openai>=0.53.1",
    "opentelemetry-overmind>=0.53.0",
    "litellm>=1.90.2",
]
description = "Overmind — autonomous agent optimization through structured experimentation"
keywords = ["overmind", "ai", "api", "client", "policy", "enforcement"]
name = "overmind"
readme = "README.md"
requires-python = ">=3.10,<4" # todo; remove the upper bound
urls = { Homepage = "https://github.com/overmind-core/overmind", Repository = "https://github.com/overmind-core/overmind" }
version = "0.1.53"


    [project.scripts]
    overmind = "overmind.__main__:app"


    [project.optional-dependencies]
    test = ["pytest>=8.0", "pytest-xdist>=3.5", "pytest-cov>=5.0"]

[tool.hatch.build.targets.wheel]
packages = ["overmind"]

[tool.coverage.report]
sort = "Cover"

[build-system]
build-backend = "hatchling.build"
requires      = ["hatchling"]

[dependency-groups]
dev = ["pre-commit>=4.5.1", "ruff>=0.15.7", "ydiff>=1.5"]
test = ["pytest>=9.0.3", "pytest-xdist>=3.5", "pytest-cov>=5.0"]
tracing-full = [
    "opentelemetry-instrumentation-requests>=0.60b1",
    "opentelemetry-instrumentation-httpx>=0.60b1",
    "opentelemetry-instrumentation-logging>=0.60b1",
]


[tool.pytest.ini_options]
filterwarnings = [
    # Rich ``Live`` warns about Jupyter when the display backend is ambiguous (e.g. under pytest).
    "ignore:install .*ipywidgets.* for Jupyter support:UserWarning",
]

[tool.ruff]
exclude = ["bae", "dspy", "openapi_client", "tests", "agents"]
fix = true
include = ["overmind/**/*.py", "tests/**/*.py"]
indent-width = 4
line-length = 120
preview = true
target-version = "py310"

    [tool.ruff.format]
    indent-style              = "space"
    line-ending               = "auto"
    quote-style               = "double"
    skip-magic-trailing-comma = false

    [tool.ruff.lint]
    ignore = [
        "BLE001",
        "SIM103",
        "S112",
        "PLW0602",
        "PLW1510",
        "E501",    # Line too long (handled by formatter)
        "B008",    # Do not perform function calls in argument defaults
        "W191",    # Indentation contains tabs
        "C408",
    ]

    select = [
        "E",   # pycodestyle errors
        "F",   # Pyflakes
        "W",   # pycodestyle warnings
        "B",   # flake8-bugbear
        "I",   # isort
        "UP",  # pyupgrade
        "C4",  # flake8-comprehensions
        "N",   # pep8-naming
        "SIM", # flake8-simplify
    ]
